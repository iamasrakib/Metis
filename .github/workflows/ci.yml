name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[test]'

      - name: Lint with Ruff
        run: |
          ruff check metis/ tests/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x -W ignore::DeprecationWarning

      - name: Validate notebook
        run: |
          python -c "import json; nb=json.load(open('Metis_Colab_Training.ipynb', encoding='utf-8')); cells=nb['cells']; assert all(isinstance(c['source'], list) and all(isinstance(s, str) for s in c['source']) for c in cells), 'cell sources must be lists of strings'; print(f'notebook OK: {len(cells)} cells')"

      - name: Test CLI entry points
        run: |
          metis --help
          for cmd in train generate chat serve ui info find-lr distill; do
            metis "$cmd" --help
          done
