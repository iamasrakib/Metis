name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install tqdm numpy tiktoken tokenizers
          pip install pytest ruff

      - name: Lint with Ruff
        run: |
          ruff check metis/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -x -W ignore::DeprecationWarning

      - name: Test CLI help
        run: |
          python -m metis.cli --help
          python -m metis.cli train --help
          python -m metis.cli generate --help
          python -m metis.cli chat --help
          python -m metis.cli info --help
