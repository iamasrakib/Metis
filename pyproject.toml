[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-llm"
version = "3.0.0"
description = "Μῆτις — A modern tiny language model built from scratch in PyTorch"
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
authors = [
    {name = "Metis Project"}
]
keywords = ["llm", "transformer", "language-model", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy",
    "tqdm",
    "tiktoken>=0.5.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
dev = ["matplotlib", "pytest", "ruff"]
test = ["pytest", "ruff", "fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.0.0", "httpx"]
tracking = ["wandb>=0.16.0"]
serve = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.0.0", "httpx"]
ui = ["gradio>=4.0.0"]
quant = ["bitsandbytes>=0.41.0"]
all = ["metis-llm[dev,tracking,serve,ui,quant]"]

[project.urls]
Homepage = "https://github.com/iamasrakib/Metis"
Repository = "https://github.com/iamasrakib/Metis"

[project.scripts]
metis = "metis.cli:main"
metis-train = "metis.cli:main"
metis-chat = "metis.cli:main"
metis-serve = "metis.server:main"
metis-ui = "metis.webui:main"

[tool.setuptools.packages.find]
include = ["metis", "metis.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
